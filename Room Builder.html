<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MaShowRooms — Voxel Room Builder</title>
  <link rel="stylesheet" href="tokens.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: var(--bg);
      font-family: var(--font-sans);
    }

    /* Three.js canvas fills the viewport */
    #canvas-root {
      position: fixed; inset: 0; z-index: 0;
    }
    #canvas-root canvas {
      display: block;
      width:  100% !important;
      height: 100% !important;
    }

    /* React overlay: transparent, pointer-events disabled except on child panels */
    #ui-root {
      position: fixed; inset: 0; z-index: 10;
      pointer-events: none;
    }

    /* Smooth theme cross-fade */
    * { transition: background-color 0.3s, border-color 0.3s, color 0.2s; }
    /* But not on canvas or 3d elements */
    canvas { transition: none !important; }

    /* Scrollbar styling for the asset grid */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 99px; }

    /* Loading veil */
    #loader {
      position: fixed; inset: 0; z-index: 999;
      background: var(--bg);
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 14px;
      transition: opacity 0.5s;
    }
    #loader.hidden { opacity: 0; pointer-events: none; }
    .loader-dot {
      display: inline-block;
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--accent); margin: 0 3px;
      animation: loaderBounce 1s ease-in-out infinite;
    }
    .loader-dot:nth-child(2) { animation-delay: 0.15s; }
    .loader-dot:nth-child(3) { animation-delay: 0.30s; }
    @keyframes loaderBounce {
      0%, 80%, 100% { transform: scale(0.7); opacity: 0.4; }
      40%            { transform: scale(1);   opacity: 1;   }
    }
  </style>
</head>
<body>

  <!-- Loading veil -->
  <div id="loader">
    <div style="font-family: var(--font-display); font-size: 20px; font-weight: 800; color: var(--fg); letter-spacing: -0.025em;">
      MaShowRooms 🏠
    </div>
    <div>
      <span class="loader-dot"></span>
      <span class="loader-dot"></span>
      <span class="loader-dot"></span>
    </div>
    <div style="font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--fg-subtle);">
      Building your room…
    </div>
  </div>

  <!-- Three.js canvas mount point -->
  <div id="canvas-root"></div>

  <!-- React UI overlay -->
  <div id="ui-root"></div>

  <!-- ── Three.js ── -->
  <script src="https://unpkg.com/three@0.158.0/build/three.min.js"></script>

  <!-- ── React 18 + Babel (pinned) ── -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js"
    integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L"
    crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
    integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm"
    crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
    integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"
    crossorigin="anonymous"></script>

  <!-- ── App data + engine ── -->
  <script src="catalog.js"></script>
  <script src="engine.js"></script>

  <!-- ── UI (Babel-compiled JSX) ── -->
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="ui.jsx"></script>

  <!-- ── Hide loader once engine is mounted ── -->
  <script>
    (function waitForEngine() {
      var loader = document.getElementById('loader');
      var start  = Date.now();
      function check() {
        // Hide once window.engine exists (set by ui.jsx useEffect)
        // or after a max of 6 seconds as a safety net
        if (window.engine || Date.now() - start > 6000) {
          if (loader) loader.classList.add('hidden');
          setTimeout(function() { if (loader) loader.remove(); }, 600);
        } else {
          requestAnimationFrame(check);
        }
      }
      requestAnimationFrame(check);
    })();
  </script>
</body>
</html>
